<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Campaign Viewer</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: #1a1d2d;
            --accent-gold: #e5b25d;
            --text-light: #e2e8f0;
            --wall-color: #334155;
            --floor-color: #1e293b;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .floor-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .floor-btn {
            background: var(--panel-bg);
            color: var(--text-light);
            border: 2px solid #334155;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .floor-btn:hover, .floor-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #2d3748;
        }

        .grid-container {
            display: grid;
            gap: 4px;
            background: #090a0f;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #334155;
        }

        .cell {
            width: 42px;
            height: 42px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            background-color: var(--floor-color);
            user-select: none;
            transition: transform 0.1s;
        }

        .cell:hover {
            transform: scale(1.08);
            z-index: 2;
        }

        .cell.wall { background-color: var(--wall-color); }
        .cell.spawn { background-color: #16a34a; box-shadow: 0 0 10px #16a34a; }
        .cell.exit { background-color: #dc2626; box-shadow: 0 0 10px #dc2626; }
        .cell.enemy { background-color: #7c3aed; }
        .cell.chest { background-color: #d97706; }

        .details-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #11131f;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-gold);
        }

        .card h3 {
            margin: 0 0 8px 0;
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .quote {
            font-style: italic;
            color: #94a3b8;
        }

        .legend {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-badge {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <h1>Dungeon Campaign Inspector</h1>
    
    <div class="floor-selector" id="floor-buttons"></div>

    <div class="container">
        <div>
            <div id="grid" class="grid-container"></div>
            <div class="legend">
                <div class="legend-item"><div class="legend-badge" style="background:#16a34a"></div> Spawn</div>
                <div class="legend-item"><div class="legend-badge" style="background:#dc2626"></div> Exit</div>
                <div class="legend-item"><div class="legend-badge" style="background:#334155"></div> Wall</div>
                <div class="legend-item"><div class="legend-badge" style="background:#7c3aed"></div> Enemy</div>
                <div class="legend-item"><div class="legend-badge" style="background:#d97706"></div> Chest</div>
            </div>
        </div>

        <div class="details-panel">
            <div class="card">
                <h3 id="level-title">Level Title</h3>
                <p id="level-lore" style="margin:0; line-height:1.5;">Floor lore will appear here...</p>
            </div>

            <div class="card" style="border-left-color: #38bdf8;">
                <h3 style="color:#38bdf8" id="npc-name">NPC Guide</h3>
                <p id="npc-quote" class="quote">"Dialogue..."</p>
            </div>

            <div class="card" style="border-left-color: #ef4444;">
                <h3 style="color:#ef4444">Boss Warning</h3>
                <p id="boss-intro" style="margin:0;">Boss intro text...</p>
            </div>

            <div class="card" style="border-left-color: #a855f7;">
                <h3 style="color:#a855f7">Mechanics & Stats</h3>
                <div id="mechanics-info" style="font-size: 0.95rem; line-height:1.6;"></div>
            </div>
        </div>
    </div>

        function loadFloor(index) {
            const level = campaignData[index];
            if (!level) return;

            // Highlight Active Button
            document.querySelectorAll(".floor-btn").forEach((btn, idx) => {
                btn.classList.toggle("active", idx === index);
            });

            // Set Grid Size
            const gridSize = level.grid_size || [10, 10];
            const cols = gridSize[0];
            const rows = gridSize[1];
            const gridEl = document.getElementById("grid");
            gridEl.style.gridTemplateColumns = `repeat(${cols}, 42px)`;
            gridEl.innerHTML = "";

            // Create Map Lookup
            const mapData = {};
            (level.objects || []).forEach(obj => {
                mapData[`${obj.x},${obj.y}`] = obj.type;
            });

            // Icons
            const icons = {
                spawn: "S", exit: "E", wall: "", enemy: "💀", chest: "📦"
            };

            // Render Cells
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    const type = mapData[`${x},${y}`];
                    
                    if (type) {
                        cell.classList.add(type);
                        cell.innerText = icons[type] || "";
                    }
                    cell.title = `(${x}, ${y}) ${type || "floor"}`;
                    gridEl.appendChild(cell);
                }
            }

            // Render Details
            const nar = level.narrative || {};
            const mec = level.mechanics || {};
            const npc = nar.npc_dialogue || {};

            document.getElementById("level-title").innerText = `Floor ${index + 1}: ${level.level_name || "Dungeon Floor"}`;
            document.getElementById("level-lore").innerText = nar.floor_lore || "No lore available.";
            document.getElementById("npc-name").innerText = `NPC: ${npc.npc_name || "Guide"}`;
            document.getElementById("npc-quote").innerText = `"${npc.quote || "Stay vigilant."}"`;
            document.getElementById("boss-intro").innerText = nar.boss_intro || "A heavy silence fills the room...";

            // Render Stats
            const enemies = (mec.enemies || []).map(e => `${e.name} (HP: ${e.hp}, DMG: ${e.damage})`).join("<br>");
            document.getElementById("mechanics-info").innerHTML = `
                <strong>Theme:</strong> ${mec.theme || "Dark Fantasy"}<br>
                <strong>Player Starting HP:</strong> ${mec.player_hp || 100}<br>
                <strong>Loot Drop Chance:</strong> ${(mec.loot_drop_chance || 0) * 100}%<br>
                <strong>Enemies:</strong><br>${enemies || "None"}
            `;
        }

        // Initialize Buttons
        const btnContainer = document.getElementById("floor-buttons");
        campaignData.forEach((lvl, idx) => {
            const btn = document.createElement("button");
            btn.className = "floor-btn";
            btn.innerText = `Floor ${idx + 1}`;
            btn.onclick = () => loadFloor(idx);
            btnContainer.appendChild(btn);
        });

        // Load First Floor
        if (campaignData.length > 0) loadFloor(0);
    </script>
